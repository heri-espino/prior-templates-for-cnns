name: paper-suggestions-analysis

on:
  push:
    branches: [paper_suggestions]
    paths:
      - 'analysis/patch_robustness_gpu_001/review.py'
      - 'studies/cnn_patch_energy_control/**'
      - 'studies/cnn_checkpoint_audit/**'
      - '.github/workflows/paper_suggestions_analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-decompose-u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy matplotlib
      - name: Decompose Stage C usefulness
        run: python analysis/patch_robustness_gpu_001/review.py
      - name: Upload regenerated analysis
        uses: actions/upload-artifact@v4
        with:
          name: stage1-decomposition
          path: |
            analysis/patch_robustness_gpu_001/REPORT.md
            analysis/patch_robustness_gpu_001/audit.json
            analysis/patch_robustness_gpu_001/method_size_rows.csv
            analysis/patch_robustness_gpu_001/paired_contrasts.csv
            analysis/patch_robustness_gpu_001/two_concepts_component_contrasts.csv
            analysis/patch_robustness_gpu_001/measurement_sensitivity.png
            analysis/patch_robustness_gpu_001/fidelity_decomposition.png

  stage2-energy-matched-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip -r studies/cnn_release_experiment/requirements.txt
      - name: Evaluate saved checkpoints with energy-matched controls
        run: python studies/cnn_patch_energy_control/evaluate_gpu.py --device cpu --batch-size 128 --output outputs/patch_energy_control_ci
      - name: Upload energy-matched analysis
        uses: actions/upload-artifact@v4
        with:
          name: stage2-energy-matched-control
          path: |
            outputs/patch_energy_control_ci/design.json
            outputs/patch_energy_control_ci/analysis/REPORT.md
            outputs/patch_energy_control_ci/analysis/metrics.csv
            outputs/patch_energy_control_ci/analysis/paired_contrasts.csv
            outputs/patch_energy_control_ci/analysis/matching_diagnostics.csv
            outputs/patch_energy_control_ci/analysis/matching_quality.csv
            outputs/patch_energy_control_ci/analysis/stage_c_consistency.csv
            outputs/patch_energy_control_ci/analysis/two_concepts_key_contrasts.csv
            outputs/patch_energy_control_ci/analysis/energy_matched_sensitivity.png

  stage4-independent-checkpoint-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install --upgrade pip -r studies/cnn_release_experiment/requirements.txt
      - name: Independently recompute sampled checkpoint metrics
        run: python studies/cnn_checkpoint_audit/audit.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-checkpoint-audit
          path: |
            analysis/checkpoint_audit/AUDIT_REPORT.md
            analysis/checkpoint_audit/audit.json
            analysis/checkpoint_audit/audit_rows.csv
