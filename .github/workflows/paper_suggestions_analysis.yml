name: paper-suggestions-analysis

on:
  push:
    branches: [paper_suggestions]
    paths:
      - 'analysis/patch_robustness_gpu_001/review.py'
      - '.github/workflows/paper_suggestions_analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-decompose-u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy matplotlib
      - name: Decompose Stage C usefulness
        run: python analysis/patch_robustness_gpu_001/review.py
      - name: Upload regenerated analysis
        uses: actions/upload-artifact@v4
        with:
          name: stage1-decomposition
          path: |
            analysis/patch_robustness_gpu_001/REPORT.md
            analysis/patch_robustness_gpu_001/audit.json
            analysis/patch_robustness_gpu_001/method_size_rows.csv
            analysis/patch_robustness_gpu_001/paired_contrasts.csv
            analysis/patch_robustness_gpu_001/two_concepts_component_contrasts.csv
            analysis/patch_robustness_gpu_001/measurement_sensitivity.png
            analysis/patch_robustness_gpu_001/fidelity_decomposition.png
