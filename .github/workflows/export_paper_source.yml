name: export-paper-source

on:
  push:
    branches: [paper_suggestions]
    paths:
      - '.github/workflows/export_paper_source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: paper-source
          path: |
            papers/main.tex
            papers/main.md
            papers/supplementary_results.tex
            papers/kernel_matching_results.tex
            papers/build_paper.sh
